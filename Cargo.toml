[package]
name = "dripp_backend"
version = "1.0.0"
edition = "2021"

[lib]
name = "dripp_backend"
crate-type = ["staticlib", "cdylib"]

[dependencies]
## Core
flutter_rust_bridge = "2.7.0"
yrs = "0.22.0"
tokio = { version = "1.10.0", features = ["rt", "rt-multi-thread", "io-util", "time", "sync"] }
rocksdb = "0.23.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
iroh = "0.31.0"
futures = "0.3"
once_cell = "1.0"

## Error Handling
thiserror = "2.0.11"

## Optional
tracing = { version = "0.1", optional = true }

[dev-dependencies]
proptest = "1.6.0" 

[profile.release]
strip = "symbols" # Strip unnecessary symbols during build
opt-level = "z" 
lto = true
panic = "abort" # Abort on panic