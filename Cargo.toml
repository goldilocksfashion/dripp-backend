[package]
name = "dripp_backend"
version = "1.0.0"
edition = "2021"
authors = ["Anirudh Vyas <ricky.nj@gmail.com>"]
description = "Iroh based FFI library to build fllutter based app Dripp"
license = "MIT"
repository = "https://github.com/goldilocksfashion/dripp_backend"
documentation = "https://docs.rs/dripp_backend"
homepage = "https://dripp.app"
keywords = ["p2p", "ffi", "networking", "social", "flutter", "dripp"]
categories = ["network-programming", "data-structures", "social-networking", "flutter", "peer-to-peer"]

[lib]
name = "dripp_backend"
crate-type = ["staticlib", "cdylib"]

[dependencies]
## Identity
uuid = "1.12.1"
ssi = "0.10.2"  
rocksdb = "0.23.0"
sha2 ="0.10.8"
bincode = "1.3.3"
ed25519-dalek = "2.1.1" 
## Networking
iroh = "0.31.0"
## Core
flutter_rust_bridge = "2.7.0"
derive_builder = "0.20.2"
thiserror = "2.0.11"
yrs = "0.22.0"
tokio = { version = "1.10.0", features = ["rt", "rt-multi-thread", "io-util", "time", "sync"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "macros", "sqlite", "json", "uuid", "tls-native-tls"] }
serde =  "1.0.217" 
serde_json = "1.0.137"
futures = "0.3"
once_cell = "1.0"


## Optional
tracing = { version = "0.1", optional = true }

[dev-dependencies]
proptest = "1.6.0" 

[profile.release]
strip = "symbols" # Strip unnecessary symbols during build
opt-level = "z" 
lto = true
panic = "abort" # Abort on panic